name: CI/CD Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools,platforms;android-37'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Build standard release APKs
        run: ./gradlew assembleStandardRelease --stacktrace

      - name: Verify APK outputs
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="app/build/outputs/apk/standard/release"
          if [[ ! -d "$apk_dir" ]]; then
            echo "::error::APK output directory not found: $apk_dir"
            find app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print
          if ! find "$apk_dir" -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error::Gradle completed but produced no APKs."
            exit 1
          fi

      - name: Upload standard release APKs
        uses: actions/upload-artifact@v4
        with:
          name: mpvEx-standard-release-${{ github.sha }}
          path: app/build/outputs/apk/standard/release/*.apk
          if-no-files-found: error
          retention-days: 14
